name: Clean stock migration artifacts
on:
  push:
    paths:
      - scripts/migrate_stock_package.py
      - .github/workflows/migrate-stock-package.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated caches
        run: python scripts/migrate_stock_package.py
      - name: Parse all Python sources without generating bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if '.git' not in path.parts:
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('All Python sources parse successfully.')
          PY
      - name: Commit cleanup and remove one-time migration files
        run: |
          rm -f scripts/migrate_stock_package.py .github/workflows/migrate-stock-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove stock migration artifacts"
          git push
