name: Apply MVP codebase review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-mvp-review.yml'
      - '.github/apply_mvp_review.py'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply cleanup
        run: python .github/apply_mvp_review.py
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Format and lint Python
        run: |
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Test Python
        run: |
          python -m compileall -q .
          pytest -q
      - name: Check TypeScript
        working-directory: zalo-gateway
        run: |
          npm install
          npm run check
      - name: Commit reviewed MVP
        run: |
          rm -f .github/workflows/apply-mvp-review.yml .github/apply_mvp_review.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: finalize single-user MVP codebase'
          git push origin main
