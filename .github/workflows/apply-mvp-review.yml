name: Apply MVP codebase review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-mvp-review.yml'
      - '.github/apply_mvp_review.py'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Review, verify and commit
        shell: bash
        run: |
          set +e
          {
            python .github/apply_mvp_review.py
            pip install -r requirements-dev.txt
            ruff check --fix --unsafe-fixes .
            ruff format .
            ruff check .
            ruff format --check .
            python -m compileall -q .
            pytest -q
            cd zalo-gateway
            npm install
            npm run check
            cd ..
          } > /tmp/mvp-review.log 2>&1
          status=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$status" -ne 0 ]; then
            cp /tmp/mvp-review.log .github/mvp-review-failure.log
            git add .github/mvp-review-failure.log
            git commit -m 'chore: capture MVP review failure'
            git push origin main
            exit "$status"
          fi
          rm -f .github/workflows/apply-mvp-review.yml .github/apply_mvp_review.py .github/mvp-review-failure.log
          git add -A
          git commit -m 'refactor: finalize single-user MVP codebase'
          git push origin main

# Triggered after the initial review run did not produce a commit.
