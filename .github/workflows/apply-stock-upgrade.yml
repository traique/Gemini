name: Apply stock pipeline upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-stock-upgrade.yml'
      - '.github/apply_stock_upgrade.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed upgrade
        run: python .github/apply_stock_upgrade.py
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify stock subsystem
        run: |
          python -m compileall -q stock test
          pytest -q test/test_stock_backtest.py test/test_stock_features.py test/test_stock_policy.py test/test_stock_validation.py test/test_stock_broker_upgrade.py test/test_stock_import_smoke.py test/test_sector_map.py test/test_market_data_guard.py test/test_symbol_detection.py
      - name: Commit directly to main
        run: |
          rm -f .github/workflows/apply-stock-upgrade.yml .github/apply_stock_upgrade.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A stock test .github
          git commit -m 'feat: harden stock data and research pipeline'
          git push origin main
