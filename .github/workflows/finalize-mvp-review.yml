name: Finalize MVP review
on:
  push:
    paths:
      - '.github/finalize-mvp-review.trigger'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply cleanup
        run: python .github/apply_mvp_review.py
      - name: Install and format
        run: |
          pip install -r requirements-dev.txt
          ruff check --fix --unsafe-fixes .
          ruff format .
          ruff check .
          ruff format --check .
      - name: Verify Python
        run: |
          python -m compileall -q .
          timeout 300 pytest -q
      - name: Verify TypeScript
        working-directory: zalo-gateway
        run: |
          npm install
          npm run check
      - name: Commit final review
        run: |
          rm -f .github/apply_mvp_review.py .github/finalize-mvp-review.trigger .github/mvp-review-failure.log
          rm -f .github/workflows/apply-mvp-review.yml .github/workflows/finalize-mvp-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: finalize single-user MVP codebase'
          git push origin main
